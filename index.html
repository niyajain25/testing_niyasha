<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus — Simple Task Board</title>
  <style>
    :root {
      --bg: #0f1020;
      --card: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f2f3ff;
      --muted: #9a9cc0;
      --accent: #7c5cff;
      --accent-2: #19c6ff;
      --danger: #ff5c7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 92, 255, 0.35), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(25, 198, 255, 0.28), transparent 40%),
        var(--bg);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      height: fit-content;
    }
    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header p { color: var(--muted); margin-top: 4px; font-size: 0.95rem; }
    .progress {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      margin: 20px 0 6px;
      overflow: hidden;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.3s ease;
    }
    .stats { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
    form { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .add {
      padding: 0 20px;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .add:hover { filter: brightness(1.1); }
    .filters { display: flex; gap: 8px; margin: 18px 0 10px; }
    .filters button {
      padding: 6px 14px;
      border-radius: 99px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .filters button.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    ul { list-style: none; display: grid; gap: 8px; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
    }
    li input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li .del {
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
    }
    li .del:hover { color: var(--danger); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .clear {
      margin-top: 16px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: underline;
    }
    .clear:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Focus</h1>
      <p>Plan your day. Tasks are saved in your browser.</p>
    </header>

    <div class="progress"><span id="bar"></span></div>
    <div class="stats" id="stats"></div>

    <form id="form">
      <input type="text" id="input" placeholder="What needs to be done?" autocomplete="off" required />
      <button class="add" type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <ul id="list"></ul>
    <button class="clear" id="clear">Clear completed</button>
  </main>

  <script>
    const KEY = "focus-tasks";
    let tasks = JSON.parse(localStorage.getItem(KEY) || "[]");
    let filter = "all";

    const $ = (id) => document.getElementById(id);
    const save = () => localStorage.setItem(KEY, JSON.stringify(tasks));

    function render() {
      const list = $("list");
      list.innerHTML = "";
      const visible = tasks.filter((t) =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nothing here yet.";
        list.appendChild(empty);
      }

      visible.forEach((t) => {
        const li = document.createElement("li");
        if (t.done) li.className = "done";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = t.done;
        cb.onchange = () => { t.done = cb.checked; save(); render(); };

        const label = document.createElement("span");
        label.textContent = t.text;

        const del = document.createElement("button");
        del.className = "del";
        del.setAttribute("aria-label", "Delete task");
        del.textContent = "×";
        del.onclick = () => { tasks = tasks.filter((x) => x.id !== t.id); save(); render(); };

        li.append(cb, label, del);
        list.appendChild(li);
      });

      const done = tasks.filter((t) => t.done).length;
      $("bar").style.width = tasks.length ? (done / tasks.length) * 100 + "%" : "0";
      $("stats").textContent = `${done} of ${tasks.length} completed`;
    }

    $("form").onsubmit = (e) => {
      e.preventDefault();
      const text = $("input").value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      $("input").value = "";
      save();
      render();
    };

    $("filters").onclick = (e) => {
      const f = e.target.dataset.filter;
      if (!f) return;
      filter = f;
      document.querySelectorAll("#filters button").forEach((b) =>
        b.classList.toggle("active", b.dataset.filter === f)
      );
      render();
    };

    $("clear").onclick = () => { tasks = tasks.filter((t) => !t.done); save(); render(); };

    render();
  </script>
</body>
</html>
